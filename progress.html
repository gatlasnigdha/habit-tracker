<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body data-auth-required="true">

<nav>
    <h2>Habit Tracker</h2>

    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" onclick="logout(event)">Logout</a></li>
    </ul>
</nav>

<div class="dashboard">

    <h1>Your Progress</h1>

    <p>Total Habits: <span id="total">0</span></p>

    <p>Completed Habits: <span id="completed">0</span></p>

    <p>Completion Percentage</p>

    <progress id="progressBar" value="0" max="100"></progress>

    <h2 id="percentage">0%</h2>

    <br>

    <a href="dashboard.html">
        <button>Back to Dashboard</button>
    </a>

</div>

<script src="auth.js"></script>
<script src="index.js"></script>

</body>
</html>
